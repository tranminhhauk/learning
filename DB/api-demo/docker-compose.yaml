version: '3.8'

services:
  api:
    build: .
    container_name: test_api_db
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=test
      - DB_USER=postgres
      - DB_PASSWORD=tranminhhau
    depends_on:
      - db
  
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tranminhhau
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: